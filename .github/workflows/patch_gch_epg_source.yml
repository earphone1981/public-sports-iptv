# trigger
name: One-time GCH EPG Source Switch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_gch_epg_source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Switch GCH EPG source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main_epg_3days.py')
          s = p.read_text(encoding='utf-8')
          old = 'https://github.com/karenda-jp/etc/raw/refs/heads/main/guides.xml'
          new = 'https://raw.githubusercontent.com/ajiousama/himitsu/main/guides.xml'
          if old not in s:
              raise SystemExit('old GCH EPG source not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('GCH EPG source switched')
          PY

      - name: Syntax check
        run: python -m py_compile main_epg_3days.py

      - name: Regenerate EPG
        run: python main_epg_3days.py

      - name: Validate XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('epg.xml'); print('XML OK')"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main_epg_3days.py epg.xml
          git diff --cached --quiet && exit 0
          git commit -m "GCH EPG: use ajiousama self-hosted source"
          git pull --rebase origin main
          git push
