name: Update YouTube LIVE Channels

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]"

      - name: Restore YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          test -n "$YOUTUBE_COOKIES"
          printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
          chmod 600 youtube_cookies.txt

      - name: Update YouTube LIVE M3U files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          CHANNELS = [
              {
                  "label": "ナミビア",
                  "source": "https://www.youtube.com/watch?v=ydYDqZQpim8",
                  "file": "namibia_live.m3u",
                  "tvg_id": "youtube.namibia.live",
                  "tvg_name": "ナミビア LIVE",
                  "display": "🇳🇦 ナミビア LIVE",
                  "group": "その他LIVE",
                  "logo": "",
                  "remove_when_offline": False,
              },
              {
                  "label": "松山市クリーンセンター",
                  "source": "https://www.youtube.com/watch?v=C0gpM_qIIl0",
                  "file": "youtube_test.m3u",
                  "tvg_id": "youtube.matsuyama.clean",
                  "tvg_name": "松山市クリーンセンター LIVE",
                  "display": "♻️ 松山市クリーンセンター LIVE",
                  "group": "その他LIVE",
                  "logo": "",
                  "remove_when_offline": False,
              },
              {
                  "label": "松山空港",
                  "source": "https://www.youtube.com/watch?v=CFh9z-6IeEE",
                  "file": "matsuyama_airport_live.m3u",
                  "tvg_id": "youtube.matsuyama.airport",
                  "tvg_name": "松山空港 LIVE",
                  "display": "✈️ 松山空港 LIVE",
                  "group": "その他LIVE",
                  "logo": "",
                  "remove_when_offline": False,
              },
              {
                  "label": "華奈tube",
                  "source": "https://www.youtube.com/@kana_tube/live",
                  "file": "kana_live.m3u",
                  "tvg_id": "youtube.kana",
                  "tvg_name": "華奈tube LIVE",
                  "display": "📺 華奈tube LIVE",
                  "group": "競輪 YouTube LIVE",
                  "logo": "https://raw.githubusercontent.com/earphone1981/public-sports-iptv/main/kana_tube.png",
                  "remove_when_offline": True,
              },
          ]

          def get_url(source):
              cmd = [
                  "yt-dlp",
                  "--js-runtimes", "node",
                  "--cookies", "youtube_cookies.txt",
                  "--extractor-args", "youtube:player_client=default,web_safari",
                  "--no-playlist",
                  "--match-filter", "is_live",
                  "--no-warnings",
                  "-f", "95/best[protocol^=m3u8]/best",
                  "-g",
                  source,
              ]
              p = subprocess.run(cmd, capture_output=True, text=True, timeout=120)
              urls = [x.strip() for x in p.stdout.splitlines() if x.strip().startswith(("http://", "https://"))]
              return urls[0] if p.returncode == 0 and urls else None

          def extinf(ch):
              logo = f' tvg-logo="{ch["logo"]}"' if ch["logo"] else ""
              return (
                  f'#EXTINF:-1 tvg-id="{ch["tvg_id"]}" tvg-name="{ch["tvg_name"]}"'
                  f'{logo} group-title="{ch["group"]}",{ch["display"]}'
              )

          results = {}
          for ch in CHANNELS:
              print(f'=== {ch["label"]} ===')
              try:
                  url = get_url(ch["source"])
              except Exception as e:
                  print("ERROR:", e)
                  url = None

              results[ch["tvg_id"]] = url

              if url:
                  Path(ch["file"]).write_text(
                      "#EXTM3U\n" + extinf(ch) + "\n" + url + "\n",
                      encoding="utf-8",
                  )
                  print("LIVE URL OK")
              elif ch["remove_when_offline"]:
                  Path(ch["file"]).write_text(
                      "#EXTM3U\n# 現在LIVEなし\n",
                      encoding="utf-8",
                  )
                  print("OFFLINE: entry will be removed")
              else:
                  print("URL取得失敗: existing entry is kept")

          path = Path("public_sports.m3u")
          lines = path.read_text(encoding="utf-8-sig").replace("\r\n", "\n").split("\n")
          managed = {ch["tvg_id"]: ch for ch in CHANNELS}

          # 既存の管理対象4chを丸ごと除去。
          # 過去の不具合で残った直後の googlevideo URL も、次のEXTINF/セクションまで掃除する。
          cleaned = []
          i = 0
          while i < len(lines):
              line = lines[i]
              tid = next((t for t in managed if f'tvg-id="{t}"' in line), None)
              if not tid:
                  cleaned.append(line)
                  i += 1
                  continue

              i += 1
              # 管理対象EXTINFに属するURLと、その直後に残った重複googlevideo URLを除去
              while i < len(lines):
                  s = lines[i].strip()
                  if s.startswith("#EXTINF:") or s.startswith("## "):
                      break
                  if s.startswith("https://manifest.googlevideo.com/") or s.startswith("https://rr") or not s:
                      i += 1
                      continue
                  # その他のURL/コメントが来たら1行だけ旧エントリとして捨てて終了
                  if s.startswith("http://") or s.startswith("https://"):
                      i += 1
                  break

          # 空行を軽く正規化
          base = []
          for line in cleaned:
              if line == "" and base and base[-1] == "":
                  continue
              base.append(line)
          while base and base[-1] == "":
              base.pop()

          # 現在取得できた管理対象だけを末尾へ、必ず EXTINF + URL 1組で追加
          for ch in CHANNELS:
              url = results.get(ch["tvg_id"])
              if not url:
                  continue
              base.extend(["", f'## {ch["group"]}', extinf(ch), url])

          path.write_text("\n".join(base).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Validate generated files
        shell: bash
        run: |
          grep -q 'tvg-id="youtube.namibia.live"' namibia_live.m3u
          grep -q '^https://' namibia_live.m3u
          grep -q 'tvg-id="youtube.namibia.live"' public_sports.m3u
          python - <<'PY'
          from pathlib import Path
          lines = Path("public_sports.m3u").read_text(encoding="utf-8-sig").splitlines()
          ids = [
              "youtube.namibia.live",
              "youtube.matsuyama.clean",
              "youtube.matsuyama.airport",
              "youtube.kana",
          ]
          for tid in ids:
              hits = [i for i, line in enumerate(lines) if f'tvg-id="{tid}"' in line]
              if len(hits) > 1:
                  raise SystemExit(f"duplicate EXTINF: {tid} x{len(hits)}")
              if hits:
                  i = hits[0]
                  if i + 1 >= len(lines) or not lines[i + 1].startswith("https://"):
                      raise SystemExit(f"URL missing immediately after EXTINF: {tid}")
          print("Managed YouTube entries are clean")
          PY

      - name: Commit updated LIVE URLs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add namibia_live.m3u youtube_test.m3u matsuyama_airport_live.m3u kana_live.m3u public_sports.m3u

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Clean and update YouTube LIVE URLs"
          git push
