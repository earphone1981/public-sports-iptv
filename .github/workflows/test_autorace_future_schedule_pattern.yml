name: Test AutoRace Future Schedule Pattern

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test AutoRace future schedule and pattern
        run: python test_autorace_future_schedule_pattern.py
