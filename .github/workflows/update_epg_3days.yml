name: Update Public Sports EPG 3 Days

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: public-sports-epg
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate 3-day EPG
        run: python main_epg_3days.py

      - name: Fix same-name Keirin channel IDs
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('epg.xml')
          tree = ET.parse(path)
          root = tree.getroot()

          wanted = {
              'keirin.kawasaki': 'かわさきⓀ',
              'keirin.nagoya': 'なごやⓀ',
              'keirin.kochi': 'こうちⓀ',
          }

          channels = {ch.get('id'): ch for ch in root.findall('channel')}

          for channel_id, display_name in wanted.items():
              ch = channels.get(channel_id)
              if ch is None:
                  ch = ET.Element('channel', {'id': channel_id})
                  # programme群より前にchannelを置く
                  insert_at = 0
                  for i, child in enumerate(list(root)):
                      if child.tag == 'channel':
                          insert_at = i + 1
                      else:
                          break
                  root.insert(insert_at, ch)
              names = ch.findall('display-name')
              if names:
                  names[0].text = display_name
                  for extra in names[1:]:
                      ch.remove(extra)
              else:
                  ET.SubElement(ch, 'display-name').text = display_name

          ET.indent(tree, space='    ')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          print('Keirin same-name channel IDs fixed')
          PY

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('epg.xml').getroot()
          channels = {ch.get('id'): (ch.findtext('display-name') or '') for ch in root.findall('channel')}
          expected = {
              'keirin.kawasaki': 'かわさきⓀ',
              'keirin.nagoya': 'なごやⓀ',
              'keirin.kochi': 'こうちⓀ',
          }
          for cid, name in expected.items():
              if channels.get(cid) != name:
                  raise SystemExit(f'ERROR: {cid} -> {channels.get(cid)!r}')
          print('XML OK / same-name Keirin IDs OK')
          PY

      - name: Commit and push EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update 3-day public sports EPG"
          git pull --rebase origin main
          git push
