name: Update Public Sports EPG 3 Days

on:
  workflow_dispatch:
  schedule:
    # 08:00 JST every day
    - cron: "0 23 * * *"
  push:
    branches:
      - main
    paths:
      # 「これ一発」が統合M3Uを書き換えたらEPGも続けて更新する
      - "public_sports.m3u"
      - "main_epg_3days.py"
      - "fix_epg_v11.py"
      - "fix_boat_waiting_title.py"
      - "fix_epg_duplicate_channel_ids.py"
      - ".github/workflows/update_epg_3days.yml"

concurrency:
  group: public-sports-epg
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate 3-day EPG
        run: python main_epg_3days.py

      - name: Finalize v11 race titles and one-minute switching
        run: python fix_epg_v11.py

      - name: Show BOAT first race while waiting
        run: python fix_boat_waiting_title.py

      # AutoRaceの当日専用後処理は実行しない。
      # main_epg_3days.py が生成した開催データを正とし、
      # 当日ページ検出失敗を「非開催」と誤認して上書きする事故を防ぐ。

      - name: Fix duplicate-name channel IDs
        run: python fix_epg_duplicate_channel_ids.py

      - name: Validate required duplicate-name channels
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('epg.xml').getroot()
          ids = [x.get('id') for x in root.findall('channel')]
          required = {
              'keirin.kawasaki', 'keirin.nagoya', 'keirin.kochi',
              'chihou.kawasaki_keiba', 'chihou.nagoya_keiba', 'chihou.kochi_keiba',
          }
          missing = sorted(required - set(ids))
          dup = sorted({x for x in ids if ids.count(x) > 1})
          if missing or dup:
              raise SystemExit(f'EPG channel validation failed: missing={missing} duplicate={dup}')
          print('Duplicate-name channel separation OK')
          PY

      - name: Validate XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('epg.xml'); print('XML OK')"

      - name: Commit and push EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update 3-day public sports EPG"
          git pull --rebase origin main
          git push
