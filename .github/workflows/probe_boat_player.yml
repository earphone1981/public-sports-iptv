name: Probe BOAT Player Ref

on:
  push:
    paths:
      - ".github/workflows/probe_boat_player.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump sakura live99 source
        shell: python
        run: |
          import urllib.request
          req=urllib.request.Request('https://boatrace.sakura.tv/live99.html',headers={'User-Agent':'Mozilla/5.0','Referer':'https://boatrace.sakura.tv/wakamatsu/'})
          with urllib.request.urlopen(req,timeout=15) as r:
              text=r.read().decode('utf-8','replace')
          print(text)
