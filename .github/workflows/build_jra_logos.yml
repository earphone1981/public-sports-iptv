name: Build Canonical JRA PNG Logos

on:
  push:
    branches:
      - main
    paths:
      - 'generate_jra_quality_pngs.py'
      - '.github/workflows/build_jra_logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build approved JRA/GCH PNG logos
        run: python generate_jra_quality_pngs.py
      - name: Commit canonical logo set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public_sports_logos_github_43/jra_quality gch.png east_web3.png west_web4.png local_web5.png hokkaido_local.png
          git diff --cached --quiet && echo "JRA/GCH logos already current" && exit 0
          git commit -m "Apply canonical JRA GCH PNG logos"
          git pull --rebase origin main
          git push origin HEAD:main
