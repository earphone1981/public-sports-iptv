name: Probe BOAT Player Ref

on:
  push:
    paths:
      - ".github/workflows/probe_boat_player.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current player assets
        shell: python
        run: |
          import json,re,urllib.request,urllib.parse,time
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          def get(url, headers=None):
              h={'User-Agent':UA}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=15) as r:
                  return r.read().decode('utf-8','replace'), r.geturl(), r.status
          setting='https://front.player.boatrace-cdn.jp/setting/live/20wakamatsu/setting.json?t=%d'%int(time.time())
          try:
              text,url,status=get(setting,{'Origin':'https://front.player.boatrace-cdn.jp','Referer':'https://front.player.boatrace-cdn.jp/'})
              print('SETTING_STATUS',status,url)
              print('SETTING_BODY',text[:12000])
          except Exception as e:
              print('SETTING_ERROR',repr(e))
          roots=['https://front.player.boatrace-cdn.jp/','https://front.player.boatrace-cdn.jp/index.html']
          assets=[]
          for root in roots:
              try:
                  html,final,status=get(root)
                  print('ROOT_STATUS',status,final)
                  print('ROOT_HEAD',html[:4000].replace('\n',' '))
                  for s in re.findall(r'(?:src|href)=["\']([^"\']+\.js[^"\']*)',html,re.I):
                      u=urllib.parse.urljoin(final,s)
                      if u not in assets: assets.append(u)
              except Exception as e:
                  print('ROOT_ERROR',root,repr(e))
          print('ASSETS',json.dumps(assets,ensure_ascii=False))
          needles=['playback.api.streaks.jp','lm-br-','cp-boatrace-prod','medias/ref','audio_only','streaks']
          for asset in assets[:20]:
              try:
                  js,final,status=get(asset)
              except Exception as e:
                  print('ASSET_ERROR',asset,repr(e)); continue
              low=js.lower()
              hits=[]
              for needle in needles:
                  p=low.find(needle.lower())
                  if p>=0:
                      hits.append((needle,js[max(0,p-800):p+1800]))
              if hits:
                  print('ASSET_MATCH',asset)
                  for needle,snip in hits:
                      print('NEEDLE',needle)
                      print(snip)
