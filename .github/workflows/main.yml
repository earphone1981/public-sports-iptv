name: Update Public Sports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🚲 競輪
      - name: Update KEIRIN
        run: python keirin_today.py

      - name: Check KEIRIN outputs
        run: |
          test -f keirin_today.json
          test -f keirin_today.m3u

      # 🐎 地方競馬
      - name: Update LOCAL KEIBA
        run: python keiba_today.py

      - name: Check LOCAL KEIBA outputs
        run: |
          test -f keiba_today.json
          test -f keiba_today.m3u

      # 🏍️ オートレース
      - name: Update AUTORACE
        run: python autorace_today.py

      - name: Check AUTORACE outputs
        run: |
          test -f autorace_today.json
          test -f autorace_today.m3u

      # 🏇 中央競馬 + グリーンチャンネル番組表
      - name: Update JRA
        run: python jra_today.py

      - name: Check JRA output
        run: |
          test -f jra_today.json

      # 🚤 ボートレースはPC取得した当日版を使用
      - name: Check BOATRACE manual files
        run: |
          test -f boatrace_today.json
          test -f boatrace_today.m3u

      # 📺 M3U一本化
      - name: Merge M3U
        run: python merge_m3u.py

      - name: Check merged M3U
        run: |
          test -f public_sports.m3u

      # 📡 EPG生成
      - name: Generate EPG
        run: python generate_epg.py

      - name: Check EPG output
        run: |
          test -f epg.xml

      # 💾 保存
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            keirin_today.json \
            keirin_today.m3u \
            keiba_today.json \
            keiba_today.m3u \
            autorace_today.json \
            autorace_today.m3u \
            jra_today.json \
            public_sports.m3u \
            epg.xml

          git diff --cached --quiet && exit 0
          git commit -m "Update public sports, JRA, M3U and EPG"
          git push
