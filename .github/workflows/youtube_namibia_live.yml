name: Update YouTube LIVE Channels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/youtube_update.trigger'
      - 'patch_public_sports_youtube_runtime.py'
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: public-sports-m3u-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre 'yt-dlp[default]'
          yt-dlp --version
      - name: Restore YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt; else printf '# Netscape HTTP Cookie File\n' > youtube_cookies.txt; fi
          chmod 600 youtube_cookies.txt
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Backup previous M3U
        run: cp public_sports_youtube.m3u /tmp/public_sports_youtube.prev.m3u 2>/dev/null || printf '#EXTM3U\n' > /tmp/public_sports_youtube.prev.m3u
      - name: Patch updater
        run: python patch_public_sports_youtube_runtime.py
      - name: Run updater and capture full log
        id: updater
        shell: bash
        run: |
          set +e
          python -u public_sports_youtube_update.py > /tmp/public_youtube_run.log 2>&1
          RC=$?
          cat /tmp/public_youtube_run.log
          echo "UPDATER_RC=$RC" >> /tmp/public_youtube_run.log
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Dedupe when updater succeeded
        if: steps.updater.outputs.rc == '0'
        run: python dedupe_public_sports_youtube.py
      - name: Build persistent diagnostic summary
        if: always()
        shell: bash
        run: |
          COUNT=$(grep -c '^#EXTINF:' public_sports_youtube.m3u 2>/dev/null || true)
          PREV=$(grep -c '^#EXTINF:' /tmp/public_sports_youtube.prev.m3u 2>/dev/null || true)
          {
            echo "UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "UPDATER_RC=${{ steps.updater.outputs.rc }}"
            echo "GENERATED_ENTRIES=$COUNT"
            echo "PREVIOUS_ENTRIES=$PREV"
            echo
            echo '===== updater log ====='
            cat /tmp/public_youtube_run.log 2>/dev/null || true
          } > public_youtube_run_latest.txt
          if [ "$COUNT" -lt 1 ]; then cp /tmp/public_sports_youtube.prev.m3u public_sports_youtube.m3u; fi
      - name: Rebuild public M3U when entries exist
        shell: bash
        run: |
          COUNT=$(grep -c '^#EXTINF:' public_sports_youtube.m3u 2>/dev/null || true)
          if [ "$COUNT" -gt 0 ]; then
            python merge_m3u.py
            python normalize_public_sports_labels.py
          fi
      - name: Commit M3U and diagnostic log
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Runtime patch is intentionally temporary; discard it before rebase/push.
          git restore --worktree public_sports_youtube_update.py || true
          git add public_sports.m3u public_sports_youtube.m3u public_youtube_run_latest.txt || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public sports YouTube LIVE and diagnostics'
          git pull --rebase origin main
          git push origin main
      - name: Fail on updater error or zero LIVE
        shell: bash
        run: |
          COUNT=$(grep -c '^#EXTINF:' public_sports_youtube.m3u 2>/dev/null || true)
          if [ "${{ steps.updater.outputs.rc }}" != '0' ] || [ "$COUNT" -lt 1 ]; then
            echo 'Public YouTube update failed; see public_youtube_run_latest.txt'
            exit 1
          fi
