name: Test KEIRIN.JP Future Schedule

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test KEIRIN.JP schedule metadata
        run: python test_keirin_jp_future_schedule.py
