name: Build OneClick Scriptable v14

on:
  push:
    paths:
      - '.github/oneclick_v14.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build v14 and latest
        shell: bash
        run: |
          cat scriptable/v14_parts/part*.txt > '公営これ一発_v14.js'
          cp '公営これ一発_v14.js' '公営これ一発_latest.js'
          node --check '公営これ一発_v14.js'

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '公営これ一発_v14.js' '公営これ一発_latest.js'
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Save 公営これ一発 v14 and latest'
          git push origin main
