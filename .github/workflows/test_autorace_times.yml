name: Test AutoRace Race Times

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test official AutoRace race times
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from html import unescape

          # 2026-08-16の開催場をCalendarから自動判定
          DATE = "2026-08-16"
          y, m, d = DATE.split("-")
          calendar_url = f"https://autorace.jp/race_info/XML/Calendar?date={y}-{m}"

          headers = {
              "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1",
              "Referer": "https://autorace.jp/",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode("utf-8", errors="replace")

          print("=== Calendar ===")
          cal = get(calendar_url)

          # Calendar APIはJSON形式
          import json
          data = json.loads(cal)

          target = DATE.replace("-", "/")
          venues = []

          body = data.get("body", [])
          for place in body:
              slug = place.get("placeKey", "")
              name = place.get("placeName", "").replace("　", "").strip()
              for item in place.get("calendar", []):
                  race = item.get("race")
                  if not race:
                      continue
                  start = race.get("periodStartDate", "")
                  # calendarの日付キー構造に依存せず、対象月の日番号も確認
                  week_date = str(item.get("weekDate", "")).zfill(2)
                  if week_date == d:
                      venues.append((name, slug))
                      break

          print("開催候補:", venues)
          if not venues:
              raise SystemExit("対象日の開催場をCalendarから検出できませんでした")

          # 最初の開催場だけテスト
          name, slug = venues[0]
          print(f"\n=== TEST {name} / {slug} / {DATE} ===")

          found = 0

          for race_no in range(1, 13):
              candidates = [
                  f"https://autorace.jp/race_info/Program/{slug}/{DATE}_{race_no}/program",
                  f"https://autorace.jp/race_info/Program/{slug}/{DATE}_{race_no}",
              ]

              result = None
              used_url = None

              for url in candidates:
                  try:
                      html = get(url)
                  except Exception as e:
                      print(f"{race_no}R fetch error: {type(e).__name__}: {e}")
                      continue

                  text = re.sub(r"<script.*?</script>", " ", html, flags=re.S | re.I)
                  text = re.sub(r"<style.*?</style>", " ", text, flags=re.S | re.I)
                  text = re.sub(r"<[^>]+>", " ", text)
                  text = unescape(text)
                  text = re.sub(r"\s+", " ", text)

                  patterns = [
                      r"発走予定(?:時刻)?\s*([0-2]?\d[:：][0-5]\d)",
                      r"発走\s*予定\s*([0-2]?\d[:：][0-5]\d)",
                      r"([0-2]?\d[:：][0-5]\d)\s*発走",
                  ]

                  for pat in patterns:
                      mm = re.search(pat, text)
                      if mm:
                          result = mm.group(1).replace("：", ":")
                          used_url = url
                          break

                  if result:
                      break

              if result:
                  found += 1
                  print(f"{race_no:>2}R  {result}  OK")
              else:
                  print(f"{race_no:>2}R  --:--  NOT FOUND")

          print(f"\nRESULT: {name} {found}/12 races")
          if found == 0:
              raise SystemExit("発走時刻を1件も取得できませんでした")
          PY
