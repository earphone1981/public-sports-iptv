name: Finalize JRA PNG Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize_jra_png_once.yml'

permissions:
  contents: write

concurrency:
  group: public-sports-m3u-writer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Rebuild public M3U
        run: python merge_m3u.py
      - name: Normalize labels
        run: python normalize_public_sports_labels.py
      - name: Split JRA EPG IDs
        run: python split_jra_quality_epg.py
      - name: Split JRA M3U IDs and PNG logos
        run: python split_jra_quality_m3u.py
      - name: Fix logo references
        run: python fix_logo_refs.py
      - name: Validate XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('epg.xml'); print('XML OK')"
      - name: Commit final JRA PNG state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml public_sports.m3u
          git diff --cached --quiet && echo "Already finalized" && exit 0
          git commit -m "Finalize JRA HQ LQ PNG channels"
          git pull --rebase origin main
          git push origin HEAD:main
