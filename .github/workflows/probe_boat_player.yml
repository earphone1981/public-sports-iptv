name: Probe BOAT Player Ref

on:
  push:
    paths:
      - ".github/workflows/probe_boat_player.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Probe current BOAT playback
        shell: python
        run: |
          import json, urllib.request, urllib.error, time, platform
          print('OS', platform.platform())
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36'
          h={'Origin':'https://front.player.boatrace-cdn.jp','Referer':'https://front.player.boatrace-cdn.jp/','User-Agent':ua,'Accept':'application/json,text/plain,*/*'}
          def get(url):
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      return r.status,r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode('utf-8','replace')
          s='https://front.player.boatrace-cdn.jp/setting/live/20wakamatsu/setting.json?t=%d'%int(time.time())
          st,body=get(s)
          print('SETTING_STATUS',st)
          obj=json.loads(body) if st==200 else {}
          for key in ('br_live','br_dvr','mix_live','mix_dvr'):
              ref=(obj.get(key) or {}).get('ref_id')
              if not ref: continue
              p='https://playback.api.streaks.jp/v1/projects/cp-boatrace-prod/medias/ref:%s?audio_only=false'%ref
              pst,pbody=get(p)
              print('PLAYBACK',key,'STATUS',pst,'REF',ref)
              if pst == 200:
                  print('BODY',pbody[:1500])
