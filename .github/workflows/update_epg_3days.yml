name: Update Public Sports EPG 3 Days

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
  push:
    branches:
      - main
    paths:
      - "public_sports.m3u"
      - "boatrace_today.m3u"
      - "boatrace_today.ps1"
      - "boatrace_github_oneclick.js"
      - "merge_m3u.py"
      - "main_epg_3days.py"
      - "split_jra_quality_epg.py"
      - "split_jra_quality_m3u.py"
      - "sanitize_jra_epg.py"
      - "fix_boat_active_from_m3u.py"
      - "fix_epg_v11.py"
      - "fix_boat_waiting_title.py"
      - "fix_boat_day_type.py"
      - "fix_autorace_today_official.py"
      - "verified_daily_override.py"
      - "apply_verified_status.py"
      - "format_race_number_epg.py"
      - "validate_race_epg_boundaries.py"
      - "fix_epg_duplicate_channel_ids.py"
      - "sort_public_sports_by_epg.py"
      - "reorder_epg_channels_by_m3u.py"
      - ".github/workflows/update_epg_3days.yml"

concurrency:
  group: public-sports-m3u-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync latest main before generation
        run: git pull --ff-only origin main

      - name: Preserve BOAT M3U supplied by iPhone one-click
        run: cp boatrace_today.m3u /tmp/boatrace_today.m3u.oneclick

      - name: Update today's BOAT RACE schedule only
        shell: pwsh
        timeout-minutes: 8
        run: ./boatrace_today.ps1

      - name: Restore iPhone one-click BOAT stream URLs
        run: cp /tmp/boatrace_today.m3u.oneclick boatrace_today.m3u

      - name: Validate BOAT schedule and one-click playlist
        shell: pwsh
        run: |
          if (!(Test-Path boatrace_today.json) -or !(Test-Path boatrace_today.m3u)) { throw 'BOAT output missing' }
          $data = Get-Content boatrace_today.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $held = @($data.PSObject.Properties | Where-Object { $_.Value.held -eq $true }).Count
          if ($held -lt 1) { throw 'BOAT daily data has no held venues' }
          $m3u = Get-Content boatrace_today.m3u -Raw -Encoding UTF8
          $streams = ([regex]::Matches($m3u, '(?m)^https?://')).Count
          Write-Host "BOAT schedule OK: held=$held / iPhone one-click streams=$streams"
          if ($streams -lt 1) {
            Write-Host 'No iPhone one-click BOAT streams are stored yet. EPG will update, but BOAT playback stays empty until Scriptable one-click is run.'
          }

      - name: Generate 3-day EPG
        timeout-minutes: 12
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u main_epg_3days.py

      - name: Merge current one-click BOAT M3U into public sports
        run: python -u merge_m3u.py

      - name: Repair BOAT active venues from current M3U
        run: python -u fix_boat_active_from_m3u.py

      - name: Repair today's AutoRace directly from all 5 official program pages
        run: python -u fix_autorace_today_official.py

      - name: Finalize v11 race titles and three-minute switching
        run: python -u fix_epg_v11.py

      - name: Show BOAT first race while waiting
        run: python -u fix_boat_waiting_title.py

      - name: Fix BOAT day type including midnight races
        run: python -u fix_boat_day_type.py

      - name: Verify today's active venues from official indexes
        run: python -u verified_daily_override.py

      - name: Apply verified active and non-event status
        run: python -u apply_verified_status.py

      - name: Format race numbers for OTT Navigator
        run: python -u format_race_number_epg.py

      - name: Validate race dates, pre-race and post-race states
        run: python -u validate_race_epg_boundaries.py

      - name: Fix duplicate-name channel IDs
        run: python -u fix_epg_duplicate_channel_ids.py

      - name: Sort public sports M3U from today's EPG
        run: python -u sort_public_sports_by_epg.py

      - name: Split JRA EPG into HQ and LQ channel IDs
        run: python -u split_jra_quality_epg.py

      - name: Sanitize JRA EPG duplicates and times
        run: python -u sanitize_jra_epg.py

      - name: Split JRA M3U IDs and assign new HQ LQ logos
        run: python -u split_jra_quality_m3u.py

      - name: Sync EPG channel order to sorted M3U
        run: python -u reorder_epg_channels_by_m3u.py

      - name: Validate XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('epg.xml'); print('XML OK')"

      - name: Commit and push generated files safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp epg.xml /tmp/epg.xml.generated
          cp public_sports.m3u /tmp/public_sports.m3u.generated
          cp boatrace_today.json /tmp/boatrace_today.json.generated
          cp boatrace_today.m3u /tmp/boatrace_today.m3u.generated
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/epg.xml.generated epg.xml
          cp /tmp/public_sports.m3u.generated public_sports.m3u
          cp /tmp/boatrace_today.json.generated boatrace_today.json
          cp /tmp/boatrace_today.m3u.generated boatrace_today.m3u
          git add epg.xml public_sports.m3u boatrace_today.json boatrace_today.m3u
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update public sports EPG with iPhone one-click BOAT M3U"
          git push origin HEAD:main
