name: Update Public Sports EPG 3 Days

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
  push:
    branches:
      - main
    paths:
      - "public_sports.m3u"
      - "boatrace_today.m3u"
      - "main_epg_3days.py"
      - "fix_boat_active_from_m3u.py"
      - "fix_epg_v11.py"
      - "fix_boat_waiting_title.py"
      - "fix_boat_day_type.py"
      - "fix_autorace_today_official.py"
      - "verified_daily_override.py"
      - "apply_verified_status.py"
      - "fix_epg_duplicate_channel_ids.py"
      - "sort_public_sports_by_epg.py"
      - "reorder_epg_channels_by_m3u.py"
      - ".github/workflows/update_epg_3days.yml"

concurrency:
  group: public-sports-m3u-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync latest main before generation
        run: git pull --ff-only origin main

      - name: Generate 3-day EPG
        timeout-minutes: 12
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u main_epg_3days.py

      - name: Repair BOAT active venues from current M3U
        run: python -u fix_boat_active_from_m3u.py

      - name: Repair today's AutoRace directly from all 5 official program pages
        run: python -u fix_autorace_today_official.py

      - name: Finalize v11 race titles and three-minute switching
        run: python -u fix_epg_v11.py

      - name: Show BOAT first race while waiting
        run: python -u fix_boat_waiting_title.py

      - name: Fix BOAT day type including midnight races
        run: python -u fix_boat_day_type.py

      - name: Verify today's active venues from official indexes
        run: python -u verified_daily_override.py

      - name: Apply verified active and non-event status
        run: python -u apply_verified_status.py

      - name: Fix duplicate-name channel IDs
        run: python -u fix_epg_duplicate_channel_ids.py

      - name: Sort public sports M3U from today's EPG
        run: python -u sort_public_sports_by_epg.py

      - name: Sync EPG channel order to sorted M3U
        run: python -u reorder_epg_channels_by_m3u.py

      - name: Validate required duplicate-name channels
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('epg.xml').getroot()
          ids = [x.get('id') for x in root.findall('channel')]
          required = {
              'keirin.kawasaki', 'keirin.nagoya', 'keirin.kochi',
              'chihou.kawasaki_keiba', 'chihou.nagoya_keiba', 'chihou.kochi_keiba',
          }
          missing = sorted(required - set(ids))
          dup = sorted({x for x in ids if ids.count(x) > 1})
          if missing or dup:
              raise SystemExit(f'EPG channel validation failed: missing={missing} duplicate={dup}')
          print('Duplicate-name channel separation OK')
          PY

      - name: Validate XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('epg.xml'); print('XML OK')"

      - name: Commit and push EPG and sorted M3U safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the files generated by this run outside the working tree.
          cp epg.xml /tmp/epg.xml.generated
          cp public_sports.m3u /tmp/public_sports.m3u.generated

          # Move onto the newest main first. This avoids rebasing a commit that
          # contains generated public_sports.m3u while another writer changed it.
          git fetch origin main
          git reset --hard origin/main

          # Put only this run's generated outputs back on top of newest main.
          cp /tmp/epg.xml.generated epg.xml
          cp /tmp/public_sports.m3u.generated public_sports.m3u

          git add epg.xml public_sports.m3u
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update EPG and sort public sports M3U"
          git push origin HEAD:main

# trigger: 2026-08-21 sync EPG channel order to M3U
