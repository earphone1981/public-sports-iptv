name: Build JRA PNG Logos

on:
  push:
    branches:
      - main
    paths:
      - 'generate_jra_quality_pngs.py'
      - 'public_sports_logos_github_43/jra_quality/*.svg'
      - '.github/workflows/build_jra_logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render JRA SVG logos to PNG
        run: python generate_jra_quality_pngs.py
      - name: Commit PNG logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_sports_logos_github_43/jra_quality/*.png
          git diff --cached --quiet && echo "PNG logos already current" && exit 0
          git commit -m "Build JRA HQ LQ PNG logos"
          git pull --rebase origin main
          git push origin HEAD:main
