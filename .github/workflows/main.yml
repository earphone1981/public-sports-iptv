name: Update Public Sports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update KEIRIN
        run: python keirin_today.py

      - name: Check outputs
        run: |
          test -f keirin_today.json
          test -f keirin_today.m3u
          echo "KEIRIN OK"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keirin_today.json keirin_today.m3u
          git diff --cached --quiet && exit 0
          git commit -m "Update KEIRIN today"
          git push
