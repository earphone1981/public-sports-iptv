name: Prune Finished BOAT Venues

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 23,0-14 * * *"
  push:
    branches:
      - main
    paths:
      - "prune_boatrace_finished.py"
      - ".github/workflows/prune_boatrace_finished.yml"

concurrency:
  group: public-sports-m3u-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Remove finished BOAT venues
        run: python -u prune_boatrace_finished.py
      - name: Validate outputs
        run: |
          test -s boatrace_today.m3u
          test -s public_sports.m3u
          python - <<'PY'
          from pathlib import Path
          text = Path('public_sports.m3u').read_text(encoding='utf-8-sig')
          assert '## ボートレース' in text
          print('BOAT section OK')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boatrace_today.json boatrace_today.m3u public_sports.m3u
          if git diff --cached --quiet; then
            echo "No finished BOAT venues to remove"
            exit 0
          fi
          git commit -m "Remove finished BOAT venues"
          git pull --rebase origin main
          git push origin main
