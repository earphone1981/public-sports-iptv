name: Test BoatRace iPhone

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Mikuni Playback API
        shell: python
        run: |
          import json
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          date = datetime.now(ZoneInfo("Asia/Tokyo")).strftime("%Y%m%d")
          code = "10mikuni"

          url = (
              "https://playback.api.streaks.jp/v1/projects/"
              f"cp-boatrace-prod/medias/ref:lm-br-{code}-tokyo-{date}"
              "?audio_only=false"
          )

          headers = {
              "Origin": "https://front.player.boatrace-cdn.jp",
              "Referer": "https://front.player.boatrace-cdn.jp/",
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/151.0.0.0 Safari/537.36"
              ),
          }

          print("DATE:", date)
          print("VENUE: 三国")
          print("API:", url)

          req = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print("HTTP:", r.status)
                  body = r.read().decode("utf-8")
                  data = json.loads(body)

              sources = data.get("sources", [])

              if sources:
                  m3u8 = sources[0].get("src")
                  print("")
                  print("===== SUCCESS =====")
                  print("M3U8:")
                  print(m3u8)
              else:
                  print("")
                  print("===== NO SOURCE =====")
                  print(json.dumps(data, ensure_ascii=False, indent=2))

          except Exception as e:
              print("")
              print("===== ERROR =====")
              print(type(e).__name__)
              print(str(e))
              raise
