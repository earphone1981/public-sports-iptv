name: Apply EPG Improvements

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Patch main_epg_3days.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("main_epg_3days.py")
          src = p.read_text(encoding="utf-8-sig")
          original = src

          anchor = "def day_emoji(day_type):\n"
          helper = '''def non_event_title(venue, category):
              return f"💤 本日非開催日です。 {venue}（{category}）"


          def finished_title(venue, category):
              return f"🏁 本日当開催場のレースは全て終了しました。 {venue}（{category}）"


          def preparing_title(venue, category):
              return f"🔄 ただ今データ取得準備中です。 {venue}（{category}）"


          '''
          if "def non_event_title(" not in src:
              if anchor not in src:
                  raise RuntimeError("day_emoji anchor not found")
              src = src.replace(anchor, helper + anchor, 1)

          replacements = {
              'f"💤 本日非開催 {v_name}（{cat_label}）"': 'non_event_title(v_name, cat_label)',
              'f"💤 本日非開催 {venue}（競馬）"': 'non_event_title(venue, "競馬")',
              'f"💤 本日非開催 {venue}（競輪）"': 'non_event_title(venue, "競輪")',
              'f"💤 本日非開催 {venue}（オートレース）"': 'non_event_title(venue, "オートレース")',
              'f"💤 本日非開催 {v_name}（ボートレース）"': 'non_event_title(v_name, "ボートレース")',
          }
          for old, new in replacements.items():
              src = src.replace(old, new)

          src = src.replace(
              'f"🏁 終了 {v_name} ({emoji}{day_type})（{cat_label}）"',
              'finished_title(v_name, cat_label)'
          )
          src = src.replace(
              'f"🏁 終了 {venue} {emoji}{day_type}",\n'
              '                f"{venue}の本日の競馬は終了しました。"',
              'finished_title(venue, "競馬"),\n'
              '                f"{venue}の本日の競馬は全て終了しました。"'
          )
          src = src.replace(
              'f"🏁 終了 {venue} {day_icon}{day_type}",\n'
              '                f"{venue}の本日の競輪は終了しました。"',
              'finished_title(venue, "競輪"),\n'
              '                f"{venue}の本日の競輪は全て終了しました。"'
          )
          src = src.replace(
              'f"🏁 JRA 本日開催終了 {stream_name}"',
              'finished_title(stream_name, "JRA")'
          )

          auto_url_anchor = (
              'AUTORACE_CALENDAR_URL = '
              '"https://autorace.jp/race_info/XML/Calendar?date={year}-{month:02d}"\n'
          )
          auto_helpers = r'''
          AUTORACE_PROGRAM_URL = (
              "https://autorace.jp/race_info/Program/{slug}/{date}_{race_no}/program"
          )

          AUTORACE_SLUG = {
              "川口": "kawaguchi",
              "伊勢崎": "isesaki",
              "浜松": "hamamatsu",
              "飯塚": "iizuka",
              "山陽": "sanyo",
          }


          def infer_autorace_day_type_from_times(races, fallback="デイ"):
              if not races:
                  return fallback or "デイ"
              try:
                  first_hour = int(races[0]["time"].split(":")[0])
                  last_hour = int(races[-1]["time"].split(":")[0])
              except Exception:
                  return fallback or "デイ"

              if first_hour < 10:
                  return "モーニング"
              if first_hour >= 18 or last_hour >= 21:
                  return "ミッドナイト"
              if first_hour >= 14 or last_hour >= 19:
                  return "ナイター"
              if last_hour >= 17:
                  return "薄暮"
              return "デイ"


          def extract_autorace_program_info(source, race_no):
              if not source:
                  return None

              plain = strip_html_tags(source)
              m_time = re.search(
                  r"発走予定(?:時刻)?\s*([0-2]?\d:[0-5]\d)",
                  plain
              )
              if not m_time:
                  return None

              hhmm = m_time.group(1)
              if len(hhmm) == 4:
                  hhmm = "0" + hhmm

              name = ""
              for pat in [
                  rf"([^\n\r]{{1,40}}?)\s*{race_no}R\s*[,，]?\s*3100[mM]",
                  rf"([^\n\r]{{1,40}}?)\s*{race_no}R\b",
              ]:
                  m_name = re.search(pat, plain)
                  if m_name:
                      candidate = clean_epg_meta_text(m_name.group(1))
                      if candidate and "発走予定" not in candidate:
                          name = candidate[-40:]
                          break

              if not name:
                  name = "競走"

              return {
                  "race": str(race_no),
                  "time": hhmm,
                  "name": name,
                  "race_type": name,
                  "icon": "🏍️",
                  "main": race_no == 12,
                  "is_semi": "準決" in name,
                  "is_final": ("優勝" in name or "決勝" in name) and "準決" not in name,
              }


          def fetch_autorace_races(date_str, venue, calendar_race=None):
              slug = AUTORACE_SLUG.get(venue)
              if not slug:
                  return None

              iso_date = f"{date_str[:4]}-{date_str[4:6]}-{date_str[6:8]}"
              races = []

              for race_no in range(1, 13):
                  url = AUTORACE_PROGRAM_URL.format(
                      slug=slug,
                      date=iso_date,
                      race_no=race_no,
                  )
                  source = fetch_text(
                      url,
                      f"AUTORACE Program {date_str} {venue} {race_no}R",
                  )
                  info = extract_autorace_program_info(source, race_no)
                  if info:
                      races.append(info)

              if not races:
                  return None

              races.sort(key=lambda x: int(x["race"]))
              calendar_race = calendar_race or {}
              fallback_day_type = (
                  clean_epg_meta_text(calendar_race.get("nighterName", ""))
                  or "デイ"
              )
              day_type = infer_autorace_day_type_from_times(
                  races,
                  fallback=fallback_day_type,
              )

              event_day_raw = calendar_race.get("paragraphDay", "")
              event_day = (
                  f"{event_day_raw}日目"
                  if str(event_day_raw).strip()
                  else ""
              )

              return {
                  "date": date_str,
                  "venues": {
                      venue: {
                          "races": races,
                          "day_type": day_type,
                          "day_emoji": day_emoji(day_type),
                          "grade": clean_epg_meta_text(
                              calendar_race.get("gradeName", "")
                          ),
                          "event_name": (
                              clean_epg_meta_text(calendar_race.get("title", ""))
                              or clean_epg_meta_text(
                                  calendar_race.get("titleShort", "")
                              )
                          ),
                          "event_day": event_day,
                      }
                  },
              }

          '''
          if "AUTORACE_PROGRAM_URL" not in src:
              if auto_url_anchor not in src:
                  raise RuntimeError("AUTORACE_CALENDAR_URL anchor not found")
              src = src.replace(
                  auto_url_anchor,
                  auto_url_anchor + auto_helpers,
                  1
              )

          start = src.find("def build_autorace_future_epg(")
          end = src.find("\ndef build_epg_xml()", start)
          if start < 0 or end < 0:
              raise RuntimeError("build_autorace_future_epg range not found")

          new_builder = r'''def build_autorace_future_epg(
              tv,
              target_date,
              month_schedule,
              JST,
              today_display,
          ):
              date_str = target_date.strftime("%Y%m%d")
              day_start = datetime.datetime.strptime(
                  f"{date_str} 01:00", "%Y%m%d %H:%M"
              ).replace(tzinfo=JST)
              day_end = datetime.datetime.strptime(
                  f"{date_str} 23:59", "%Y%m%d %H:%M"
              ).replace(tzinfo=JST)

              venues = month_schedule.get(date_str, {})
              handled = 0
              real_race_venues = 0

              for venue, tvg_id in AUTO_MAP.items():
                  race = venues.get(venue)

                  if not race:
                      add_programme(
                          tv,
                          tvg_id,
                          day_start,
                          day_end,
                          non_event_title(venue, "オートレース"),
                          f"AutoRace.JP公式カレンダーで"
                          f"{today_display}の本場開催はありません。",
                      )
                      continue

                  handled += 1

                  real_data = fetch_autorace_races(
                      date_str,
                      venue,
                      calendar_race=race,
                  )
                  if real_data:
                      used = build_autorace_race_epg(
                          tv,
                          date_str,
                          real_data,
                          JST,
                          today_display,
                      )
                      if used:
                          real_race_venues += 1
                          continue

                  grade = clean_epg_meta_text(race.get("gradeName", ""))
                  title = (
                      clean_epg_meta_text(race.get("title", ""))
                      or clean_epg_meta_text(race.get("titleShort", ""))
                  )
                  day_type = (
                      clean_epg_meta_text(race.get("nighterName", ""))
                      or "デイ"
                  )
                  emoji = day_emoji(day_type)
                  event_day = race.get("paragraphDay", "")
                  start_text = str(race.get("liveStartTime", "") or "").strip()
                  end_text = str(race.get("liveEndTime", "") or "").strip()
                  provisional = False

                  try:
                      if not start_text or not end_text:
                          raise ValueError("official live time unavailable")
                      start_dt = datetime.datetime.strptime(
                          f"{date_str} {start_text}",
                          "%Y%m%d %H:%M",
                      ).replace(tzinfo=JST)
                      end_dt = datetime.datetime.strptime(
                          f"{date_str} {end_text}",
                          "%Y%m%d %H:%M",
                      ).replace(tzinfo=JST)
                      if end_dt <= start_dt:
                          end_dt += datetime.timedelta(days=1)
                  except Exception:
                      provisional = True
                      start_dt, end_dt, start_text, end_text = build_provisional_times(
                          date_str,
                          day_type,
                          JST,
                      )

                  if day_start < start_dt:
                      add_programme(
                          tv,
                          tvg_id,
                          day_start,
                          start_dt,
                          f"⏳ 開催待ち {venue} {emoji}{day_type}",
                          f"🏍️ オートレース {venue}\n"
                          f"📢 {title}\n"
                          f"📅 {today_display}",
                      )

                  parts = ["📅 開催予定", venue, f"{emoji}{day_type}"]
                  if grade:
                      parts.append(grade)
                  if title:
                      parts.append(title)
                  if event_day:
                      parts.append(f"{event_day}日目")

                  desc = [f"🏍️ オートレース {venue}"]
                  if grade:
                      desc.append(f"🏆 グレード: {grade}")
                  if title:
                      desc.append(f"📢 開催名: {title}")
                  if event_day:
                      desc.append(f"📅 開催日次: {event_day}日目")

                  if provisional:
                      parts.append(PROVISIONAL_NOTICE)
                      desc.append(
                          f"⏰ 仮予定: {start_text}～"
                          f"{'翌' if end_dt.date() != start_dt.date() else ''}{end_text}"
                      )
                      desc.append(f"⚠️ {PROVISIONAL_NOTICE}")
                  elif start_text and end_text:
                      desc.append(f"⏰ 公式LIVE予定: {start_text}～{end_text}")

                  desc.append(f"📅 {today_display}")

                  add_programme(
                      tv,
                      tvg_id,
                      start_dt,
                      end_dt,
                      " ".join(parts),
                      "\n".join(desc),
                  )

                  if end_dt.date() == day_start.date() and end_dt < day_end:
                      add_programme(
                          tv,
                          tvg_id,
                          end_dt,
                          day_end,
                          finished_title(venue, "オートレース"),
                          f"{venue}の本日のオートレースは全て終了しました。",
                      )

              print(
                  f"AUTORACE EPG {date_str}: "
                  f"{handled}場開催 / 各R実時刻 {real_race_venues}場"
              )
              return True
          '''

          src = src[:start] + new_builder + src[end:]

          a = src.find("def build_autorace_race_epg(")
          b = src.find("\ndef ", a + 10)
          if a >= 0 and b > a:
              part = src[a:b]
              part = part.replace(
                  'f"🏁 終了 {venue} {day_icon}{day_type}",',
                  'finished_title(venue, "オートレース"),'
              )
              part = part.replace(
                  'f"{venue}の本日のオートレースは終了しました."',
                  'f"{venue}の本日のオートレースは全て終了しました。"'
              )
              part = part.replace(
                  'f"{venue}の本日のオートレースは終了しました。"',
                  'f"{venue}の本日のオートレースは全て終了しました。"'
              )
              src = src[:a] + part + src[b:]

          build_anchor = "        is_today = (day_offset == 0)\n"
          prep_block = '''        # 00:00～01:00: 次回データ取得準備中
              midnight = datetime.datetime.strptime(
                  f"{date_str} 00:00", "%Y%m%d %H:%M"
              ).replace(tzinfo=JST)
              one_am = datetime.datetime.strptime(
                  f"{date_str} 01:00", "%Y%m%d %H:%M"
              ).replace(tzinfo=JST)

              preparing_channels = {}
              for name, cid in KEIRIN_MAP.items():
                  preparing_channels[cid] = (name, "競輪")
              for name, cid in KEIBA_MAP.items():
                  preparing_channels[cid] = (name, "競馬")
              for name, cid in AUTO_MAP.items():
                  preparing_channels[cid] = (name, "オートレース")
              for name, cid in BOAT_MAP.items():
                  preparing_channels[cid] = (name, "ボートレース")
              for name, cid in JRA_STREAM_MAP.items():
                  preparing_channels[cid] = (name, "JRA")

              for cid, (name, category) in preparing_channels.items():
                  add_programme(
                      tv,
                      cid,
                      midnight,
                      one_am,
                      preparing_title(name, category),
                      "日付更新後の次回EPGデータ取得・反映を準備しています。",
                  )
          '''
          if "00:00～01:00: 次回データ取得準備中" not in src:
              if build_anchor not in src:
                  raise RuntimeError("is_today anchor not found")
              src = src.replace(
                  build_anchor,
                  build_anchor + prep_block,
                  1
              )

          if src == original:
              raise RuntimeError("No changes applied")

          p.write_text(src, encoding="utf-8")
          print("main_epg_3days.py patched successfully")
          PY

      - name: Syntax check
        run: python -m py_compile main_epg_3days.py

      - name: Generate EPG
        run: python main_epg_3days.py

      - name: Validate XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('epg.xml'); print('epg.xml OK')"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main_epg_3days.py epg.xml
          git commit -m "Improve AutoRace times and EPG status titles" || exit 0
          git push
