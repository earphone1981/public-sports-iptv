name: Test WINTICKET Keirin Future

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test WINTICKET 2026-08-15 and 08-16
        run: python test_winticket_keirin_future.py
