name: Add Temporary GCH Direct Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add temporary direct GCH entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public_sports.m3u')
          text = path.read_text(encoding='utf-8-sig')

          start = '# --- TEMP GCH DIRECT TEST START ---'
          end = '# --- TEMP GCH DIRECT TEST END ---'
          if start in text and end in text:
              a = text.index(start)
              b = text.index(end) + len(end)
              text = text[:a].rstrip() + '\n' + text[b:].lstrip('\n')

          block = r'''
# --- TEMP GCH DIRECT TEST START ---
#EXTINF:-1 tvg-id="gch.direct.main" tvg-logo="https://www.hikaritv.net/resources/hikari/pc/images/ch_logo/ch220/770.png" group-title="競馬",グリーンチャンネル(主放送)【直URLテスト・無音】
https://variants.streaks.jp/v5/gch/1f185cafa59741d2bed50f48b351de09/c8ccda6346f34a8cbc4c99a1c3f181df/manifest_6.m3u8?vt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlZGdlIjoibGl2ZS1nY2guc3RyZWFrcy5qcCJ9.gT7IYcwKRel8iO-zQWZQg4RzuFdNOdq7drqvOYqgt0s&_HLS_skip=YES
#EXTINF:-1 tvg-id="gch.direct.east" tvg-logo="https://www.hikaritv.net/resources/hikari/pc/images/ch_logo/ch220/770.png" group-title="競馬",グリーンチャンネル(チャンネル3)【直URLテスト・無音】
https://variants.streaks.jp/v5/gch/d2596ba17a2a4265a65324b00d0b47b4/e6ced951b38047bda3b67c807f1868a8/manifest_5.m3u8?vt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlZGdlIjoibGl2ZS1nY2guc3RyZWFrcy5qcCJ9.gT7IYcwKRel8iO-zQWZQg4RzuFdNOdq7drqvOYqgt0s&_HLS_skip=YES
#EXTINF:-1 tvg-id="gch.direct.west" tvg-logo="https://www.hikaritv.net/resources/hikari/pc/images/ch_logo/ch220/770.png" group-title="競馬",グリーンチャンネル(チャンネル4)【直URLテスト・無音】
https://variants.streaks.jp/v5/gch/7c08bb020c404e53ac20258c282debbc/581b3a09461e40c3860e347664d67f68/manifest_5.m3u8?vt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlZGdlIjoibGl2ZS1nY2gyLnN0cmVha3MuanAifQ.iwkG2Zlz9d71wMifMZtwqC3ztgOUlukSH0VVKytfQsE&_HLS_skip=YES
#EXTINF:-1 tvg-id="gch.direct.hokkaido" tvg-logo="https://www.hikaritv.net/resources/hikari/pc/images/ch_logo/ch220/770.png" group-title="競馬",グリーンチャンネル(チャンネル5)【直URLテスト・無音】
https://variants.streaks.jp/v5/gch/9cb08fbe7c5040fa9b9eb2d4059d8593/122fa6bbe3ff44a689e42137bbc3eac7/manifest_8.m3u8?vt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlZGdlIjoibGl2ZS1nY2guc3RyZWFrcy5qcCJ9.gT7IYcwKRel8iO-zQWZQg4RzuFdNOdq7drqvOYqgt0s&_HLS_skip=YES
# --- TEMP GCH DIRECT TEST END ---
'''.strip()

          text = text.rstrip() + '\n\n' + block + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_sports.m3u
          git commit -m "Add temporary GCH direct URL tests" || exit 0
          git push
