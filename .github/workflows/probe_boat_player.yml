name: Probe BOAT Player Ref

on:
  push:
    paths:
      - ".github/workflows/probe_boat_player.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect JLC streamer page
        shell: python
        run: |
          import re, urllib.request, urllib.parse
          url='https://livebb.jlc.ne.jp/bb_top/new_bb/streamer/streamer.php?md=L&jo=20'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://boatrace.sakura.tv/'})
          with urllib.request.urlopen(req,timeout=15) as r:
              text=r.read().decode('utf-8','replace'); final=r.geturl()
          print('FINAL',final,'LEN',len(text))
          for pat in [r'<iframe[^>]+src=["\']([^"\']+)',r'<script[^>]+src=["\']([^"\']+)',r'https?://[^"\'<> ]+\.m3u8[^"\'<> ]*',r'https?://[^"\'<> ]+(?:streaks|boatrace-cdn|youtube|googlevideo)[^"\'<> ]*']:
              for x in re.findall(pat,text,re.I):
                  print('MATCH',urllib.parse.urljoin(final,x))
          for line in text.splitlines():
              if any(k in line.lower() for k in ('iframe','player','m3u8','stream','streaks','youtube','boatrace-cdn')):
                  print('LINE',line[:2500])
