name: Diagnose GCH HTTP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Diagnose GCH manifests keys and segments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.error
          from urllib.parse import urljoin

          files = ["gchmain.m3u8","EAST_test.m3u8","WEST_master .m3u8","hokaido_master (1).m3u8"]
          headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"}

          def fetch(url, limit=1000):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,r.headers.get("Content-Type"),r.read(limit)
              except urllib.error.HTTPError as e:
                  return e.code,e.headers.get("Content-Type"),e.read(limit)
              except Exception as e:
                  return None,None,(type(e).__name__+": "+str(e)).encode()

          for fn in files:
              print("\n"+"="*70+"\n"+fn)
              text=Path(fn).read_text(encoding="utf-8-sig",errors="replace")
              urls=re.findall(r'https?://[^"\s]+',text)
              for n,media_url in enumerate(urls,1):
                  status,ctype,body=fetch(media_url,12000)
                  print(f"MEDIA {n}: HTTP {status} {ctype}")
                  if status != 200: continue
                  playlist=body.decode("utf-8","replace")
                  km=re.search(r'#EXT-X-KEY:[^\n]*URI="([^"]+)"',playlist)
                  if km:
                      key_url=urljoin(media_url,km.group(1))
                      ks,kct,kbody=fetch(key_url,64)
                      print("  KEY HTTP:",ks,"Content-Type:",kct,"bytes:",len(kbody))
                      print("  KEY HEX:",kbody[:16].hex() if ks==200 else repr(kbody[:100]))
                  else:
                      print("  NO AES KEY FOUND")
                  seg=None
                  for line in playlist.splitlines():
                      line=line.strip()
                      if line and not line.startswith("#"):
                          seg=urljoin(media_url,line); break
                  if seg:
                      ss,sct,sbody=fetch(seg,64)
                      print("  SEGMENT HTTP:",ss,"Content-Type:",sct,"bytes-read:",len(sbody))
                      print("  SEGMENT HEAD:",sbody[:16].hex() if ss==200 else repr(sbody[:100]))
                  else:
                      print("  NO SEGMENT FOUND")
          PY
