name: Diagnose YouTube Namibia HLS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]"

      - name: Show yt-dlp version
        run: |
          yt-dlp --version
          node --version

      - name: Restore YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -z "$YOUTUBE_COOKIES" ]; then
            echo "ERROR: YOUTUBE_COOKIES secret is empty"
            exit 1
          fi
          printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
          chmod 600 youtube_cookies.txt
          echo "Cookie file restored."
          echo "Size: $(wc -c < youtube_cookies.txt) bytes"

      - name: Diagnose formats
        continue-on-error: true
        run: |
          yt-dlp -v -F \
            --js-runtimes node \
            --cookies youtube_cookies.txt \
            --extractor-args "youtube:player_client=default,web_safari" \
            "https://www.youtube.com/watch?v=ydYDqZQpim8"

      - name: Get HLS URL
        id: hls
        continue-on-error: true
        shell: bash
        run: |
          set +e
          URL=$(yt-dlp -v \
            --js-runtimes node \
            --cookies youtube_cookies.txt \
            --extractor-args "youtube:player_client=default,web_safari" \
            -f "95/best[protocol^=m3u8]/best" \
            -g \
            "https://www.youtube.com/watch?v=ydYDqZQpim8" 2>yt_err.txt)
          echo "===== yt-dlp stderr ====="
          cat yt_err.txt
          echo
          echo "===== HLS RESULT ====="
          if [ -n "$URL" ]; then
            echo "HLS URL取得成功"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          else
            echo "HLS URL取得失敗"
          fi

      - name: Test HLS playlist
        if: steps.hls.outputs.url != ''
        shell: bash
        env:
          URL: ${{ steps.hls.outputs.url }}
        run: |
          echo "===== HEADERS / PLAYLIST ====="
          python - <<'PY'
          import os
          import urllib.request
          url = os.environ["URL"]
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1",
              "Referer": "https://www.youtube.com/",
              "Origin": "https://www.youtube.com",
          })
          with urllib.request.urlopen(req, timeout=20) as r:
              body = r.read().decode("utf-8", "replace")
              print("HTTP:", r.status)
              print("Content-Type:", r.headers.get("content-type"))
              print("Final URL:", r.geturl())
              print(body[:5000])
          PY

      - name: Test first media segment
        if: steps.hls.outputs.url != ''
        shell: bash
        env:
          URL: ${{ steps.hls.outputs.url }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          url = os.environ["URL"]
          headers = {
              "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1",
              "Referer": "https://www.youtube.com/",
              "Origin": "https://www.youtube.com",
          }
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=20) as r:
              text = r.read().decode("utf-8", "replace")
          segment = None
          for line in text.splitlines():
              line = line.strip()
              if line.startswith("http") and ("seg.ts" in line or "videoplayback" in line):
                  segment = line
                  break
          if not segment:
              print("No segment URL found")
              raise SystemExit(2)
          print("SEGMENT URL FOUND")
          req2 = urllib.request.Request(segment, headers=headers)
          with urllib.request.urlopen(req2, timeout=20) as r2:
              data = r2.read(4096)
              print("SEG HTTP:", r2.status)
              print("SEG TYPE:", r2.headers.get("content-type"))
              print("SEG FIRST BYTES:", len(data))
          PY
