name: Recolor Keirin 333m Logos

on:
  push:
    branches: [logo-333-recolor]
    paths:
      - '.github/trigger_recolor_keirin_333.txt'

permissions:
  contents: write

jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: logo-333-recolor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/recolor_keirin_333.py
      - name: Commit recolored logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_sports_logos_github_43/keirin_logos_github_ready/{matsudo,odawara,ito,toyama,nara,hofu}.png
          git commit -m "Recolor 333m keirin logos" || exit 0
          git push
