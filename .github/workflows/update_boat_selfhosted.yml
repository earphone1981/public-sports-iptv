name: Update BOAT Streams (Japan self-hosted)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: boat-selfhosted-writer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    # Default labels created by the GitHub self-hosted runner installer on Windows.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: powershell
        run: git pull --ff-only origin main

      - name: Keep cloud-generated BOAT schedule JSON
        shell: powershell
        run: Copy-Item boatrace_today.json "$env:RUNNER_TEMP\boatrace_today.json.cloud" -Force

      - name: Fetch BOAT streams using the Aug-26 direct Streaks method
        shell: powershell
        run: .\boatrace_today.ps1

      - name: Accept only real Streaks HLS
        shell: powershell
        run: |
          $text = Get-Content boatrace_today.m3u -Raw -Encoding UTF8
          $entries = ([regex]::Matches($text, '(?m)^#EXTINF:')).Count
          $streaks = ([regex]::Matches($text, 'https://manifest\.streaks\.jp/')).Count
          Write-Host "BOAT self-hosted result: entries=$entries streaks=$streaks"
          if ($entries -lt 1 -or $streaks -lt 1 -or $entries -ne $streaks) {
            throw "No usable direct Streaks HLS. Refusing to publish fallback/cloud-bound URLs."
          }

      - name: Restore cloud schedule JSON
        shell: powershell
        run: Copy-Item "$env:RUNNER_TEMP\boatrace_today.json.cloud" boatrace_today.json -Force

      - name: Merge BOAT streams into public sports M3U
        shell: powershell
        run: .\merge_boat_into_public_sports.ps1

      - name: Commit playable BOAT streams only
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boatrace_today.m3u public_sports.m3u
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No BOAT stream changes"
            exit 0
          }
          git commit -m "Update playable BOAT Streaks streams [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
