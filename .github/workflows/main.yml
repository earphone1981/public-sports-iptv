name: Update Public Sports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🚲 競輪
      - name: Update KEIRIN
        run: python keirin_today.py

      - name: Check KEIRIN outputs
        run: |
          test -f keirin_today.json
          test -f keirin_today.m3u
          echo "KEIRIN OK"

      # 🐎 地方競馬
      - name: Update LOCAL KEIBA
        run: python keiba_today.py

      - name: Check LOCAL KEIBA outputs
        run: |
          test -f keiba_today.json
          test -f keiba_today.m3u
          echo "LOCAL KEIBA OK"

      # 🏍️ オートレース
      - name: Update AUTORACE
        run: python autorace_today.py

      - name: Check AUTORACE outputs
        run: |
          test -f autorace_today.json
          test -f autorace_today.m3u
          echo "AUTORACE OK"

      # 🚤 ボートレース
      # Actionsでは取得しない。手動で置いた最新ファイルを使用。
      - name: Check BOATRACE manual files
        run: |
          test -f boatrace_today.json
          test -f boatrace_today.m3u
          echo "BOATRACE manual files OK"

      # 📺 EPG生成
      - name: Generate EPG
        run: python generate_epg.py

      - name: Check EPG output
        run: |
          test -f epg.xml
          echo "EPG OK"

      # 💾 自動生成分だけ保存
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            keirin_today.json \
            keirin_today.m3u \
            keiba_today.json \
            keiba_today.m3u \
            autorace_today.json \
            autorace_today.m3u \
            epg.xml

          git diff --cached --quiet && exit 0

          git commit -m "Update public sports and EPG"
          git push
