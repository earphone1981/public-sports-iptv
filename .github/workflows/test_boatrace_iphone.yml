name: Test BoatRace iPhone Windows

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Test Mikuni Playback API
        shell: powershell
        run: |
          $d = (Get-Date).ToUniversalTime().AddHours(9).ToString("yyyyMMdd")

          $headers = @{
              "Origin"     = "https://front.player.boatrace-cdn.jp"
              "Referer"    = "https://front.player.boatrace-cdn.jp/"
              "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
          }

          $code = "10mikuni"

          $playbackUrl = "https://playback.api.streaks.jp/v1/projects/cp-boatrace-prod/medias/ref:lm-br-$code-tokyo-$d`?audio_only=false"

          Write-Host "DATE: $d"
          Write-Host "VENUE: 三国"
          Write-Host "API: $playbackUrl"

          try {
              $r = Invoke-WebRequest `
                  -Uri $playbackUrl `
                  -Headers $headers `
                  -UseBasicParsing `
                  -TimeoutSec 15 `
                  -ErrorAction Stop

              Write-Host ""
              Write-Host "HTTP: $($r.StatusCode)"

              $j = $r.Content | ConvertFrom-Json

              if ($j.sources -and $j.sources.Count -gt 0) {
                  $m3u8 = $j.sources[0].src

                  Write-Host ""
                  Write-Host "===== SUCCESS ====="
                  Write-Host "M3U8:"
                  Write-Host $m3u8
              }
              else {
                  Write-Host ""
                  Write-Host "===== NO SOURCE ====="
                  Write-Host $r.Content
              }
          }
          catch {
              Write-Host ""
              Write-Host "===== ERROR ====="
              Write-Host $_.Exception.Message

              if ($_.Exception.Response) {
                  Write-Host "STATUS:"
                  Write-Host $_.Exception.Response.StatusCode
              }

              exit 1
          }
