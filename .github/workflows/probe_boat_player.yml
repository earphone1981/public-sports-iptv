name: Probe BOAT Player Ref

on:
  push:
    paths:
      - ".github/workflows/probe_boat_player.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current player refs
        shell: python
        run: |
          import json,urllib.request,time
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          H={'Origin':'https://front.player.boatrace-cdn.jp','Referer':'https://front.player.boatrace-cdn.jp/','User-Agent':UA}
          def get(url):
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=15) as r:
                  return r.read().decode('utf-8','replace'),r.status
          s_url='https://front.player.boatrace-cdn.jp/setting/live/20wakamatsu/setting.json?t=%d'%int(time.time())
          text,status=get(s_url)
          print('SETTING_STATUS',status)
          obj=json.loads(text)
          print('SETTING_BODY',json.dumps(obj,ensure_ascii=False))
          for key in ('br_live','br_dvr','mix_live','mix_dvr'):
              ref=(obj.get(key) or {}).get('ref_id')
              if not ref: continue
              p='https://playback.api.streaks.jp/v1/projects/cp-boatrace-prod/medias/ref:%s?audio_only=false'%ref
              try:
                  body,st=get(p)
                  print('PLAYBACK',key,'STATUS',st,'REF',ref)
                  print('BODY',body[:5000])
              except Exception as e:
                  print('PLAYBACK',key,'ERROR',repr(e),'REF',ref)
