name: Update Public Sports EPG 3 Days

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/epg_update.trigger'

concurrency:
  group: public-sports-epg
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate 3-day EPG
        run: python main_epg_3days.py

      - name: Add Hamamatsu external exact-time fallback
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import html
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          JST = datetime.timezone(datetime.timedelta(hours=9))
          today = datetime.datetime.now(JST).date()
          prefix = today.strftime('%Y%m%d')
          cid = 'auto.hamamatsu'

          # 今回の浜松普通開催は 8/17-8/20。
          # AutoRace.JP の当日 Program が取れない場合は、
          # WINTICKET で開催確認 → OddsPark で各R実発走時刻を取得する。
          if not (datetime.date(2026, 8, 17) <= today <= datetime.date(2026, 8, 20)):
              print('Hamamatsu external fallback: not applicable today')
              raise SystemExit(0)

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'ja-JP,ja;q=0.9',
          }

          # WINTICKETで当日開催を確認。取得不能でもOddsPark実データ取得は継続する。
          try:
              req = urllib.request.Request(
                  'https://www.winticket.jp/autorace/hamamatsu/schedule',
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  wt = r.read().decode('utf-8', errors='replace')
              wt_plain = re.sub(r'<[^>]+>', ' ', html.unescape(wt))
              wt_plain = re.sub(r'\s+', ' ', wt_plain)
              confirmed = ('8月17日' in wt_plain and '8月20日' in wt_plain and '浜松' in wt_plain)
              print('WINTICKET Hamamatsu schedule confirmed:', confirmed)
          except Exception as e:
              print('WINTICKET Hamamatsu schedule fetch failed:', e)

          races = []
          for race_no in range(1, 13):
              url = (
                  'https://www.oddspark.com/autorace/RaceList.do'
                  f'?placeCd=04&raceDy={prefix}&raceNo={race_no}'
              )
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      src = r.read().decode('utf-8', errors='replace')
              except Exception as e:
                  print(f'OddsPark Hamamatsu {race_no}R fetch failed:', e)
                  continue

              plain = re.sub(r'(?is)<script.*?</script>', ' ', src)
              plain = re.sub(r'(?is)<style.*?</style>', ' ', plain)
              plain = re.sub(r'<[^>]+>', ' ', plain)
              plain = re.sub(r'\s+', ' ', html.unescape(plain))
              m = re.search(r'発走時間\s*([0-2]?\d)\s*[:：]\s*([0-5]\d)', plain)
              if not m:
                  print(f'OddsPark Hamamatsu {race_no}R: start time not found')
                  continue
              hhmm = f'{int(m.group(1)):02d}:{m.group(2)}'
              races.append((race_no, hhmm))
              print(f'OddsPark Hamamatsu {race_no}R -> {hhmm}')

          if len(races) < 9:
              raise SystemExit(f'ERROR: Hamamatsu exact times insufficient: {len(races)}R')

          path = Path('epg.xml')
          tree = ET.parse(path)
          root = tree.getroot()

          # 当日浜松の誤った「非開催」等をすべて消し、実Rで置換。
          for p in list(root.findall('programme')):
              if p.get('channel') == cid and (p.get('start') or '').startswith(prefix):
                  root.remove(p)

          starts = []
          for race_no, hhmm in races:
              hh, mm = map(int, hhmm.split(':'))
              starts.append((race_no, datetime.datetime.combine(today, datetime.time(hh, mm), tzinfo=JST)))

          for idx, (race_no, start) in enumerate(starts):
              if idx + 1 < len(starts):
                  stop = starts[idx + 1][1]
              else:
                  stop = start + datetime.timedelta(minutes=30)
              p = ET.SubElement(
                  root, 'programme',
                  start=start.strftime('%Y%m%d%H%M%S +0900'),
                  stop=stop.strftime('%Y%m%d%H%M%S +0900'),
                  channel=cid,
              )
              ET.SubElement(p, 'title', lang='ja').text = (
                  f'{race_no}R 浜松オートレース 発走 {start:%H:%M}'
              )
              ET.SubElement(p, 'desc', lang='ja').text = (
                  'AutoRace.JP当日出走表取得不能時の外部フォールバック。'
                  'WINTICKETで開催確認し、OddsPark出走表の実発走時刻を採用。'
              )

          ET.indent(tree, space='    ')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          print('Hamamatsu external fallback added:', len(starts), 'races')
          PY

      - name: Add official Sanyo midnight fallback
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import xml.etree.ElementTree as ET
          from pathlib import Path

          JST=datetime.timezone(datetime.timedelta(hours=9))
          today=datetime.datetime.now(JST).date()
          official_9r_ranges=[
              (datetime.date(2026,4,1),datetime.date(2026,4,3)),
              (datetime.date(2026,5,12),datetime.date(2026,5,14)),
              (datetime.date(2026,5,21),datetime.date(2026,5,23)),
              (datetime.date(2026,6,15),datetime.date(2026,6,17)),
              (datetime.date(2026,7,30),datetime.date(2026,8,1)),
              (datetime.date(2026,8,17),datetime.date(2026,8,20)),
              (datetime.date(2026,9,10),datetime.date(2026,9,12)),
              (datetime.date(2026,9,16),datetime.date(2026,9,18)),
          ]
          times9=['19:53','20:20','20:48','21:16','21:44','22:12','22:40','23:08','23:40']
          if not any(a <= today <= b for a,b in official_9r_ranges):
              print('Sanyo official 9R fallback: not applicable today')
              raise SystemExit(0)

          path=Path('epg.xml')
          tree=ET.parse(path); root=tree.getroot(); cid='auto.sanyo'
          prefix=today.strftime('%Y%m%d')
          for p in list(root.findall('programme')):
              if p.get('channel')==cid and (p.get('start') or '').startswith(prefix):
                  root.remove(p)

          starts=[]
          for t in times9:
              h,m=map(int,t.split(':'))
              starts.append(datetime.datetime.combine(today,datetime.time(h,m),tzinfo=JST))
          for i,start in enumerate(starts,1):
              stop=starts[i] if i < len(starts) else start+datetime.timedelta(minutes=20)
              p=ET.SubElement(root,'programme',start=start.strftime('%Y%m%d%H%M%S +0900'),stop=stop.strftime('%Y%m%d%H%M%S +0900'),channel=cid)
              ET.SubElement(p,'title',lang='ja').text=f'{i}R 山陽ミッドナイトオートレース 発走 {start:%H:%M}'
              ET.SubElement(p,'desc',lang='ja').text='AutoRace.JP 2026年度上期 山陽ミッドナイトオートレース（9R制）公式発走予定時刻表による当日実時刻。'
          ET.indent(tree,space='    ')
          tree.write(path,encoding='utf-8',xml_declaration=True)
          print('Sanyo official midnight fallback added:', len(starts), 'races')
          PY

      - name: Fix same-name Keirin channel IDs
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path('epg.xml'); tree=ET.parse(path); root=tree.getroot()
          wanted={'keirin.kawasaki':'かわさきⓀ','keirin.nagoya':'なごやⓀ','keirin.kochi':'こうちⓀ'}
          channels={ch.get('id'):ch for ch in root.findall('channel')}
          for cid,name in wanted.items():
              ch=channels.get(cid)
              if ch is None:
                  ch=ET.Element('channel',{'id':cid}); root.insert(0,ch)
              names=ch.findall('display-name')
              if names: names[0].text=name
              else: ET.SubElement(ch,'display-name').text=name
          ET.indent(tree,space='    '); tree.write(path,encoding='utf-8',xml_declaration=True)
          PY

      - name: Validate XML and today's AutoRace
        run: |
          python - <<'PY'
          import datetime
          import xml.etree.ElementTree as ET
          JST=datetime.timezone(datetime.timedelta(hours=9))
          today=datetime.datetime.now(JST).date()
          prefix=today.strftime('%Y%m%d')
          root=ET.parse('epg.xml').getroot()

          if datetime.date(2026,8,17) <= today <= datetime.date(2026,8,20):
              ham=[p for p in root.findall('programme') if p.get('channel')=='auto.hamamatsu' and (p.get('start') or '').startswith(prefix) and '発走' in (p.findtext('title') or '')]
              san=[p for p in root.findall('programme') if p.get('channel')=='auto.sanyo' and (p.get('start') or '').startswith(prefix)]
              if len(ham) < 9:
                  raise SystemExit(f'ERROR: Hamamatsu race EPG expected >=9, got {len(ham)}')
              if len(san) != 9:
                  raise SystemExit(f'ERROR: Sanyo midnight EPG expected 9, got {len(san)}')
              print('Hamamatsu race EPG OK:', len(ham))
              print('Sanyo midnight EPG OK:', len(san))
          print('XML OK')
          PY

      - name: Commit and push EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update 3-day public sports EPG"
          git pull --rebase origin main
          git push
