name: Normalize Public Sports Labels

on:
  push:
    branches:
      - main
    paths:
      - 'epg.xml'
      - 'public_sports.m3u'
      - 'keirin_master.m3u'
      - 'keiba_master.m3u'
      - 'autorace_master.m3u'
      - 'boatrace_today.m3u'
      - 'kana_live.m3u'
      - 'youtube_test.m3u'
      - 'namibia_live.m3u'
      - 'matsuyama_airport_live.m3u'
      - 'merge_m3u.py'
      - 'normalize_public_sports_labels.py'
      - 'fix_logo_refs.py'
      - '.github/workflows/normalize_public_sports.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-public-sports
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebuild public M3U
        run: python merge_m3u.py

      - name: Normalize EPG and M3U labels/status
        run: python normalize_public_sports_labels.py

      - name: Fix IPTV logo references
        run: python fix_logo_refs.py

      - name: Validate XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('epg.xml'); print('XML OK')"

      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml public_sports.m3u boatrace_today.m3u keirin_master.m3u
          git diff --cached --quiet && echo "No normalization changes" && exit 0
          git commit -m "Normalize public sports labels and EPG status"
          git pull --rebase origin main
          git push
