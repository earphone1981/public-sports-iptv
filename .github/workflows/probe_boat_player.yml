name: Probe BOAT Player Ref

on:
  push:
    paths:
      - ".github/workflows/probe_boat_player.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect sakura venue-switch code
        shell: python
        run: |
          import urllib.request
          url='https://boatrace.sakura.tv/index.js?26031501'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://boatrace.sakura.tv/wakamatsu/'})
          with urllib.request.urlopen(req,timeout=15) as r:
              text=r.read().decode('utf-8','replace')
          print('LEN',len(text))
          lines=text.splitlines()
          for i,line in enumerate(lines):
              low=line.lower()
              if any(k in low for k in ('live-video','iframe','live99','jlc','youtube','player','stream')):
                  a=max(0,i-5); b=min(len(lines),i+8)
                  print('\n---',i+1,'---')
                  for x in lines[a:b]: print(x[:2000])
