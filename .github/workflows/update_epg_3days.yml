name: Update Public Sports EPG 3 Days

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/epg_update.trigger'

concurrency:
  group: public-sports-epg
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Patch AutoRace exact-time parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main_epg_3days.py')
          s = p.read_text(encoding='utf-8')

          old = 'AUTORACE_PROGRAM_BASE = "https://autorace.jp/race_info/Program/{slug}/{date}_{race_no}"'
          new = 'AUTORACE_PROGRAM_BASE = "https://autorace.jp/race_info/Program/Web/{slug}/{date}_{race_no}"'
          if old in s:
              s = s.replace(old, new)

          # AutoRace WEB出走表は「発走予定10 : 56」のようにコロン前後へ空白が入る。
          s = s.replace(
              'r"(?:発走予定|発走時刻|発走)\\s*[:：]?\\s*([0-2]?\\d:[0-5]\\d)"',
              'r"(?:発走予定|発走時刻|発走)\\s*[:：]?\\s*([0-2]?\\d\\s*[:：]\\s*[0-5]\\d)"'
          )
          s = s.replace(
              'r"投票締切\\s*[:：]?\\s*([0-2]?\\d:[0-5]\\d)"',
              'r"投票締切\\s*[:：]?\\s*([0-2]?\\d\\s*[:：]\\s*[0-5]\\d)"'
          )

          # 抽出後の「10 : 56」「10：56」を必ず HH:MM に正規化。
          needle = 'time_text = m.group(1) if m else ""\n'
          repl = (
              'time_text = m.group(1) if m else ""\n'
              '    if time_text:\n'
              '        time_text = re.sub(r"\\s+", "", time_text).replace("：", ":")\n'
          )
          if needle in s and repl not in s:
              s = s.replace(needle, repl, 1)

          needle2 = 'hh, mm = map(int, m.group(1).split(":"))\n'
          repl2 = (
              'raw_deadline = re.sub(r"\\s+", "", m.group(1)).replace("：", ":")\n'
              '            hh, mm = map(int, raw_deadline.split(":"))\n'
          )
          if needle2 in s:
              s = s.replace(needle2, repl2, 1)

          p.write_text(s, encoding='utf-8')
          print('AutoRace parser patched: Program/Web + spaced-colon times')
          PY

      - name: Generate 3-day EPG
        run: python main_epg_3days.py

      - name: Fix same-name Keirin channel IDs
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('epg.xml')
          tree = ET.parse(path)
          root = tree.getroot()

          wanted = {
              'keirin.kawasaki': 'かわさきⓀ',
              'keirin.nagoya': 'なごやⓀ',
              'keirin.kochi': 'こうちⓀ',
          }

          channels = {ch.get('id'): ch for ch in root.findall('channel')}

          for channel_id, display_name in wanted.items():
              ch = channels.get(channel_id)
              if ch is None:
                  ch = ET.Element('channel', {'id': channel_id})
                  insert_at = 0
                  for i, child in enumerate(list(root)):
                      if child.tag == 'channel':
                          insert_at = i + 1
                      else:
                          break
                  root.insert(insert_at, ch)
              names = ch.findall('display-name')
              if names:
                  names[0].text = display_name
                  for extra in names[1:]:
                      ch.remove(extra)
              else:
                  ET.SubElement(ch, 'display-name').text = display_name

          ET.indent(tree, space='    ')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          print('Keirin same-name channel IDs fixed')
          PY

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('epg.xml').getroot()
          channels = {ch.get('id'): (ch.findtext('display-name') or '') for ch in root.findall('channel')}
          expected = {
              'keirin.kawasaki': 'かわさきⓀ',
              'keirin.nagoya': 'なごやⓀ',
              'keirin.kochi': 'こうちⓀ',
          }
          for cid, name in expected.items():
              if channels.get(cid) != name:
                  raise SystemExit(f'ERROR: {cid} -> {channels.get(cid)!r}')
          print('XML OK / same-name Keirin IDs OK')
          PY

      - name: Commit and push EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update 3-day public sports EPG"
          git pull --rebase origin main
          git push
