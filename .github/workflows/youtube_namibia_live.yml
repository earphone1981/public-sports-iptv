name: Update YouTube LIVE Channels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/youtube_update.trigger'

concurrency:
  group: public-sports-youtube-live
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]"

      - name: Restore YouTube cookies
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          test -n "$YOUTUBE_COOKIES"
          printf '%s' "$YOUTUBE_COOKIES" > youtube_cookies.txt
          chmod 600 youtube_cookies.txt

      - name: Refresh requested その他LIVE only
        run: python youtube_base_update.py

      - name: Refresh かなチューブ only
        run: python youtube_dynamic_update.py

      - name: Normalize public sports labels
        run: python normalize_public_sports_labels.py

      - name: Validate generated M3U
        shell: bash
        run: |
          test -s public_sports.m3u
          if grep -Eq 'group-title="(競輪 YouTube LIVE|地方競馬 YouTube LIVE|オートレース YouTube LIVE|ボートレース YouTube LIVE|公営競技 横断LIVE)"' public_sports.m3u; then
            echo "ERROR: 公営競技YouTubeサブが残っています"
            exit 1
          fi
          echo "YouTube sub channels: none"

      - name: Commit updated LIVE URLs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public_sports.m3u kana_live.m3u namibia_live.m3u youtube_test.m3u matsuyama_airport_live.m3u || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update selected YouTube LIVE URLs"
          git pull --rebase origin main
          git push
